name: Remove Current Pending Shopify Orders

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Read-only preflight or approved HQ soft deletion
        required: true
        default: preflight
        type: choice
        options:
          - preflight
          - apply
      expected_digest:
        description: Exact target digest printed by preflight; required for apply
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: remove-current-pending-shopify-orders
  cancel-in-progress: false

jobs:
  remove:
    name: ${{ inputs.mode == 'apply' && 'Soft-delete exact pending set' || 'Preflight exact pending set' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Select IPv4-compatible production database endpoint
        env:
          PRODUCTION_DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
        run: |
          node <<'NODE'
          const { appendFileSync } = require('node:fs')
          const url = new URL(process.env.PRODUCTION_DATABASE_URL)
          const directHost = 'db.ukjjopridghvwzobrsus.supabase.co'
          if (url.hostname === directHost) {
            url.hostname = 'aws-1-ap-northeast-1.pooler.supabase.com'
            if (decodeURIComponent(url.username) === 'postgres') url.username = 'postgres.ukjjopridghvwzobrsus'
          }
          const value = url.toString()
          console.log(`::add-mask::${value}`)
          appendFileSync(process.env.GITHUB_ENV, `DATABASE_URL=${value}\nDIRECT_URL=${value}\n`)
          NODE

      - run: npm ci

      - name: Preflight exact 15 records
        if: inputs.mode == 'preflight'
        env:
          PRODUCTION_SMOKE_HQ_EMAIL: ${{ secrets.PRODUCTION_SMOKE_HQ_EMAIL }}
        run: node scripts/ops/remove-current-pending-shopify-orders.mjs

      - name: Soft-delete exact preflight set and verify
        if: inputs.mode == 'apply'
        env:
          EXPECTED_DIGEST: ${{ inputs.expected_digest }}
          PRODUCTION_SMOKE_HQ_EMAIL: ${{ secrets.PRODUCTION_SMOKE_HQ_EMAIL }}
        run: node scripts/ops/remove-current-pending-shopify-orders.mjs --apply
