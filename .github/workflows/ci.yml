name: CI

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # CI-only ephemeral database. Never points at production.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/ci
      DIRECT_URL: postgresql://ci:ci@127.0.0.1:5432/ci
      INVENTORY_TEST_DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/ci
      JAR_EXCHANGE_TEST_DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/ci
      AUTH_SECRET: ci-only-not-a-production-secret
      NEXT_PUBLIC_APP_URL: http://localhost:3000
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install browser for isolated POS acceptance
        run: npx playwright install --with-deps chromium

      - name: Prisma validation
        run: npm run prisma:validate

      - name: Apply CI migrations
        run: npm run prisma:deploy

      - name: TypeScript check
        run: npm run typecheck

      - name: Tests
        env:
          NODE_ENV: test
        run: npm test

      - name: Next.js build
        env:
          NODE_ENV: production
        run: npm run build

      - name: POS browser acceptance (desktop and mobile, CI data only)
        run: npx playwright test --config playwright.pos.config.mjs

      - name: Preserve POS browser failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pos-browser-failure-evidence
          path: |
            playwright-report/
            test-results/pos/
          if-no-files-found: ignore
          retention-days: 7
