name: CI

on:
  schedule:
    # 08:17 Taiwan time; off the top-of-hour scheduler peak.
    - cron: '17 0 * * *'
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # CI-only ephemeral database. Never points at production.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/ci
      DIRECT_URL: postgresql://ci:ci@127.0.0.1:5432/ci
      INVENTORY_TEST_DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/ci
      JAR_EXCHANGE_TEST_DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/ci
      AUTH_SECRET: ci-only-not-a-production-secret
      NEXT_PUBLIC_APP_URL: http://localhost:3000
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Match package-lock.json: official image already contains Chromium + OS dependencies.
      - name: Prepare isolated browser image
        timeout-minutes: 4
        run: docker pull mcr.microsoft.com/playwright:v1.56.1-noble

      - name: Prisma validation
        run: npm run prisma:validate

      - name: Apply CI migrations
        run: npm run prisma:deploy

      - name: TypeScript check
        run: npm run typecheck

      - name: Tests
        env:
          NODE_ENV: test
        run: npm test

      - name: Next.js build
        env:
          NODE_ENV: production
        run: npm run build

      - name: POS browser acceptance (desktop and mobile, CI data only)
        timeout-minutes: 8
        run: |
          docker run --rm --init --network host --ipc host \
            -e CI=true -e DATABASE_URL -e DIRECT_URL \
            -e INVENTORY_TEST_DATABASE_URL -e JAR_EXCHANGE_TEST_DATABASE_URL \
            -e AUTH_SECRET -e NEXT_PUBLIC_APP_URL \
            -v "$PWD:/work" -w /work \
            mcr.microsoft.com/playwright:v1.56.1-noble \
            npx --no-install playwright test --config playwright.pos.config.mjs

      - name: Preserve POS browser failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pos-browser-failure-evidence
          path: |
            playwright-report/
            test-results/pos/
          if-no-files-found: ignore
          retention-days: 7

  production_probe:
    name: Public production checks (read-only)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check production public pages and authorization gates
        run: node scripts/scheduled-production-smoke.mjs
      - name: Preserve bounded production check report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-public-probe
          path: production-public-probe.json
          if-no-files-found: error
          retention-days: 7
