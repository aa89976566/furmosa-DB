name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/ci
      DIRECT_URL: postgresql://ci:ci@127.0.0.1:5432/ci
      AUTH_SECRET: ci-only-not-a-production-secret
      NEXT_PUBLIC_APP_URL: http://localhost:3000
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply official Next 15 async request API codemod
        run: npx --yes @next/codemod@canary next-async-request-api .

      - name: Commit codemod output to incident branch
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app
          if git diff --cached --quiet; then
            echo "No codemod changes to commit"
          else
            git diff --cached --check
            git commit -m "fix(next15): apply async request API codemod"
            git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
          fi

      - name: Prisma validation
        run: npm run prisma:validate

      - name: Apply CI migrations
        run: npm run prisma:deploy

      - name: TypeScript check
        run: npm run typecheck

      - name: Tests
        env:
          NODE_ENV: test
        run: npm test

      - name: Next.js build
        env:
          NODE_ENV: production
        run: npm run build
