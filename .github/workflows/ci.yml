name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # CI-only ephemeral database. Never points at production.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/ci
      DIRECT_URL: postgresql://ci:ci@127.0.0.1:5432/ci
      AUTH_SECRET: ci-only-not-a-production-secret
      NEXT_PUBLIC_APP_URL: http://localhost:3000
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Preview official Next 15 async request API codemod
        shell: bash
        run: |
          npx --yes @next/codemod@canary next-async-request-api .
          git diff --binary > next15-async-request-api.patch
          git diff --name-only > next15-async-request-api-files.txt

      - name: Upload codemod preview
        uses: actions/upload-artifact@v4
        with:
          name: next15-async-request-api-preview
          path: |
            next15-async-request-api.patch
            next15-async-request-api-files.txt
          if-no-files-found: error
          retention-days: 1

      - name: Prisma validation
        run: npm run prisma:validate

      - name: Apply CI migrations
        run: npm run prisma:deploy

      - name: TypeScript check
        run: npm run typecheck

      - name: Tests
        env:
          NODE_ENV: test
        run: npm test

      - name: Next.js build diagnostic
        id: next_build
        env:
          NODE_ENV: production
        shell: bash
        run: |
          set -o pipefail
          npm run build -- --debug-prerender 2>&1 | tee next-build.log

      - name: Upload Next.js build diagnostic
        if: failure() && steps.next_build.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: next-build-diagnostic
          path: next-build.log
          if-no-files-found: error
          retention-days: 1
