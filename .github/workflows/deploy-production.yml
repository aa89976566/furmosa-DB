name: Deploy Production

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: Open PR number targeting main
        required: true
        type: string
      expected_head_sha:
        description: Exact 40-character PR head SHA
        required: true
        type: string
      migration_plan:
        description: Explicit approved production migration plan
        required: true
        default: none
        type: choice
        options:
          - none
          - hq_inventory_advisory_20260917
          - hq_passkeys_20260918
          - pos_shipment_notifications_20260922
          - historical_hq_schema_repair_20260921

permissions:
  contents: write
  pull-requests: write
  checks: read
  statuses: read

concurrency:
  group: production-release
  cancel-in-progress: false

jobs:
  release:
    name: Controlled production release
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment:
      name: production
      url: ${{ vars.PRODUCTION_ORIGIN }}
    env:
      RELEASE_PR_NUMBER: ${{ inputs.pr_number }}
      RELEASE_EXPECTED_HEAD_SHA: ${{ inputs.expected_head_sha }}
      RELEASE_MIGRATION_PLAN: ${{ inputs.migration_plan }}
      PRODUCTION_ORIGIN: ${{ vars.PRODUCTION_ORIGIN }}
      RAILWAY_STATUS_CONTEXT: ${{ vars.RAILWAY_STATUS_CONTEXT || 'furmosa-hq - furmosa-hq' }}

    steps:
      - name: Checkout trusted release controller
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Select IPv4-compatible production database endpoint
        env:
          PRODUCTION_DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
        run: |
          node <<'NODE'
          const { appendFileSync } = require('node:fs')
          const url = new URL(process.env.PRODUCTION_DATABASE_URL)
          const directHost = 'db.ukjjopridghvwzobrsus.supabase.co'
          if (url.hostname === directHost) {
            url.hostname = 'aws-1-ap-northeast-1.pooler.supabase.com'
            if (decodeURIComponent(url.username) === 'postgres') {
              url.username = 'postgres.ukjjopridghvwzobrsus'
            }
          }
          const value = url.toString()
          console.log(`::add-mask::${value}`)
          appendFileSync(process.env.GITHUB_ENV, `DATABASE_URL=${value}\nDIRECT_URL=${value}\n`)
          NODE

      - name: Verify exact PR, CI and migration plan
        id: preflight
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/release/verify-pr.mjs

      - name: Checkout exact approved PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.preflight.outputs.head_sha }}
          fetch-depth: 0

      - name: Keep release controller changes separate
        if: steps.preflight.outputs.already_merged != 'true'
        run: |
          git fetch origin main --quiet
          git diff --exit-code origin/main -- .github/workflows/deploy-production.yml scripts/release vercel.json scripts/vercel-ignore-build.mjs

      - name: Install dependencies
        run: npm ci

      - name: Apply explicit production migration plan
        if: steps.preflight.outputs.migration_runner != ''
        run: node "${{ steps.preflight.outputs.migration_runner }}"

      - name: Verify production DB login, order and shipment reads
        env:
          PRODUCTION_SMOKE_HQ_EMAIL: ${{ secrets.PRODUCTION_SMOKE_HQ_EMAIL }}
          PRODUCTION_SMOKE_HQ_PASSWORD: ${{ secrets.PRODUCTION_SMOKE_HQ_PASSWORD }}
        run: node scripts/release/production-readiness.mjs

      - name: Merge exact PR head
        if: steps.preflight.outputs.already_merged != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh pr merge "${RELEASE_PR_NUMBER}"
          --repo "${GITHUB_REPOSITORY}"
          --squash
          --match-head-commit "${{ steps.preflight.outputs.head_sha }}"

      - name: Resolve merge commit
        id: merge
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ steps.preflight.outputs.already_merged }}" = "true" ]; then
            merge_sha="${{ steps.preflight.outputs.merge_sha }}"
          else
            merge_sha="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${RELEASE_PR_NUMBER}" --jq '.merge_commit_sha')"
          fi
          test -n "$merge_sha" && test "$merge_sha" != "null"
          echo "sha=$merge_sha" >> "$GITHUB_OUTPUT"

      - name: Wait for Railway deployment of the merge commit
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ steps.merge.outputs.sha }}
        run: node scripts/release/wait-railway-status.mjs

      - name: Run public read-only production smoke
        run: npm run smoke:production -- "${PRODUCTION_ORIGIN}"

      - name: Recheck production DB reads after deployment
        env:
          PRODUCTION_SMOKE_HQ_EMAIL: ${{ secrets.PRODUCTION_SMOKE_HQ_EMAIL }}
          PRODUCTION_SMOKE_HQ_PASSWORD: ${{ secrets.PRODUCTION_SMOKE_HQ_PASSWORD }}
        run: node scripts/release/production-readiness.mjs

      - name: Write release record
        if: always()
        env:
          RELEASE_HEAD_SHA: ${{ steps.preflight.outputs.head_sha }}
          RELEASE_MERGE_SHA: ${{ steps.merge.outputs.sha }}
          RELEASE_RESULT: ${{ job.status }}
        run: |
          node -e 'const fs=require("node:fs"); const data={repository:process.env.GITHUB_REPOSITORY,runId:process.env.GITHUB_RUN_ID,pr:Number(process.env.RELEASE_PR_NUMBER),headSha:process.env.RELEASE_HEAD_SHA||null,mergeSha:process.env.RELEASE_MERGE_SHA||null,migrationPlan:process.env.RELEASE_MIGRATION_PLAN,result:process.env.RELEASE_RESULT,createdAt:new Date().toISOString()}; fs.writeFileSync("production-release-record.json",JSON.stringify(data,null,2)); fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,"## Production release\n\n```json\n"+JSON.stringify(data,null,2)+"\n```\n");'

      - name: Upload release record
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-release-${{ github.run_id }}
          path: production-release-record.json
          retention-days: 90
