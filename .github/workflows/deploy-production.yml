name: Deploy Production


on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: Open PR number targeting main
        required: true
        type: string
      expected_head_sha:
        description: Exact 40-character PR head SHA
        required: true
        type: string
      migration_plan:
        description: Explicit approved production migration plan
        required: true
        default: none
        type: choice
        options:
          - none
          - hq_inventory_advisory_20260917
          - hq_passkeys_20260918
          - pos_shipment_notifications_20260922
          - historical_hq_schema_repair_20260921


permissions:
  contents: write
  pull-requests: write
  checks: read
  statuses: read


concurrency:
  group: production-release
  cancel-in-progress: false


jobs:
  release:
